    const out = exact.map(Math.floor);
    const order = exact.map((x, i) => ({i, f: x - out[i]})).sort((a, b) => b.f - a.f || a.i - b.i);
    for (let n = total - sum(out), i = 0; i < n; i++) out[order[i % order.length].i]++;

    {id:'forest',name:'森谷',kind:'林業・里山',n:1000,ages:[8,13,29,31,19],remote:.55,road:63,water:54,facility:58,rc:.52,wc:.39,fc:.85,jobs:38,childcare:53,mobility:58,access:66,homes:10,vacant:75,x:257,y:225},

    {id:'remote',name:'奥里',kind:'小さな山里',n:500,ages:[4,9,26,35,26],remote:1,road:51,water:45,facility:46,rc:.55,wc:.41,fc:.75,jobs:29,childcare:42,mobility:39,access:53,homes:5,vacant:70,x:162,y:96}
  ];
  const P = [
    {id:'road_care',name:'道路・橋の予防修繕',cat:'インフラ',asset:'road',years:1,staff:1,grant:.20,cooldown:3,icon:'road',desc:'傷みの軽いうちに補修。寿命を延ばし、大規模更新を先送りする。',effect:'道路健全度 +17',basis:'rc',mult:1.55},
    {id:'road_rebuild',name:'道路・橋の重点更新',cat:'インフラ',asset:'road',years:2,staff:2,grant:.35,icon:'bridge',desc:'主要路と橋を更新。費用は大きいが、低下した安全性を回復する。',effect:'道路健全度 98へ',basis:'rc',mult:7.5},
    {id:'road_merge',name:'代替路確保・橋の集約',cat:'インフラ',asset:'road',years:3,staff:2,grant:.30,icon:'route',desc:'代替ルートを整え、管理対象を減らす。生活路は残す。',effect:'道路維持費 −30% / 道路 +12 / 交通 −3',basis:'rc',mult:4.5},
    {id:'water_rebuild',name:'水道施設・管路の更新',cat:'インフラ',asset:'water',years:3,staff:2,grant:.35,icon:'water',desc:'既存の給水系統を更新。給水を維持しながら施工する。',effect:'水道健全度 98へ',basis:'wc',mult:10},
    {id:'water_merge',name:'給水設備の集約・小規模化',cat:'インフラ',asset:'water',years:3,staff:2,grant:.40,icon:'water',desc:'代替給水を確保してから切替。小規模地区に合う設備へ。',effect:'水道維持費 −32% / 水道健全度 92へ',basis:'wc',mult:9.5},

    {id:'facility_merge',name:'学校・公共施設の複合化',cat:'インフラ',asset:'facility',years:3,staff:2,grant:.40,icon:'building',desc:'通学・通所の手段を確保し、受入施設を改修して機能をまとめる。',effect:'施設維持費 −30% / 施設 90へ / 生活拠点 −3',basis:'fc',mult:3.7},
    {id:'mobility',name:'予約型交通・通学支援',cat:'暮らし',asset:'mobility',years:1,staff:1,grant:.30,cost:.30,annual:.20,icon:'bus',desc:'少人数の移動・通学を支える。開始後は毎年の運行費が必要。',effect:'交通 +18 / 生活拠点 +5（運行中）'},
    {id:'housing',name:'空き家の改修・流通',cat:'産業・定住',asset:'housing',years:1,staff:1,grant:.35,cost:.65,cooldown:2,icon:'home',desc:'空き家を住める状態にし、貸し手と借り手をつなぐ。',effect:'入居可能な空き家 最大+40戸'},
    {id:'succession',name:'地元企業の事業承継',cat:'産業・定住',asset:'jobs',years:2,staff:1,grant:.30,cost:.80,cooldown:4,icon:'work',desc:'後継者探しと設備引継ぎを支援。地元で働く選択肢を守る。',effect:'仕事の充実度 +14'},
    {id:'startup',name:'小さな創業・雇用づくり',cat:'産業・定住',asset:'jobs',years:2,staff:1,grant:.25,cost:1.05,cooldown:4,icon:'work',desc:'小さな事業の立ち上げと雇用を支援する。成果は完成後に反映。',effect:'仕事の充実度 +18'},
    {id:'childcare',name:'保育・子育て支援の拡充',cat:'暮らし',asset:'childcare',years:1,staff:1,grant:.25,cost:.36,annual:.22,icon:'people',desc:'預かりと子育ての支援体制を厚くする。出生と定住に緩やかに作用。',effect:'子育て +18（運用中）'},
    {id:'migration',name:'移住・定住の伴走支援',cat:'産業・定住',asset:'migration',years:1,staff:1,grant:.25,cost:.18,annual:.12,icon:'people',desc:'仕事・住宅・暮らしをまとめて案内。住まいや仕事がなければ効果は小さい。',effect:'転入候補 ×1.35（住宅供給が上限）'},
    {id:'relocation',name:'中心地区への住み替え支援',cat:'暮らし',asset:'relocation',years:2,staff:1,grant:.40,cost:.60,cooldown:4,icon:'route',desc:'合意した最大12世帯が中央駅前へ。町全体の人口は直接増減しない。',effect:'最大28人が町内転居 / 中央駅前の住宅が必要'},
    {id:'shared',name:'隣町との共同維持管理',cat:'行政',asset:'shared',years:2,staff:2,grant:.40,cost:1.50,annual:.08,town:true,icon:'link',desc:'技術職員と発注業務を共同化。運営費を負担しつつ実施体制を広げる。',effect:'実施余力 +2 / 基礎経費 −0.22億円／年（運用中）'}
  ];
  const policy = id => P.find(p => p.id === id);
  const district = (s, id) => s.districts.find(d => d.id === id);
  const active = (s, id, target) => s.programs.some(p => p.policy === id && p.target === target);
  function effective(s, d, key) {
    let n = d[key];
    if (key === 'mobility' && active(s,'mobility',d.id)) n += 18;
    if (key === 'access' && active(s,'mobility',d.id)) n += 5;
    if (key === 'childcare' && active(s,'childcare',d.id)) n += 18;
    return clamp(n, 0, 100);
  }
  function life(s,d) {
    return clamp(.32*effective(s,d,'mobility') + .25*effective(s,d,'access') + .16*effective(s,d,'childcare') + .15*d.road + .12*d.water, 0, 100);
  }
  function safety(s) { return weighted(s,d=>(d.road+d.water+d.facility)/3); }
  function capacity(s, plan) {
    return 6 + (active(s,'shared','town') && !(plan && plan.stops.includes('shared:town')) ? 2 : 0);
  }
  function infrastructureNeed(s) {
    return sum(s.districts.map(d => d.rc*7.5*Math.max(0,65-d.road)/65 + d.wc*10*Math.max(0,65-d.water)/65 + d.fc*4.2*Math.max(0,65-d.facility)/65));
  }
  function defaultPlan(s) {return {projects:[],stops:[],upkeep:s.upkeep,waterRate:s.waterRate,borrow:0};}
  function createState(options={}) {
    const s={version:VERSION,year:0,seed:options.seed||2048,events:!!options.events,funds:15,debt:38,upkeep:1,waterRate:100,crisisYears:0,districts:[],projects:[],programs:[],completed:{},history:[],nextId:1};
    s.districts=SPECS.map(d=>({...clone(d),ages:apportion(d.n,d.ages),flags:{roadMerge:false,waterMerge:false,facilityMerge:false},trust:66}));
    s.initialWorkers=sum(s.districts.map(d=>d.ages[1]+d.ages[2]));
    s.initialOld=sum(s.districts.map(d=>d.ages[3]+d.ages[4]));
    s.initialJobs=weighted(s,d=>d.jobs);
    const fin=finance(s,defaultPlan(s));
    s.history.push(snapshot(s,{births:0,deaths:0,incoming:0,outgoing:0,internal:0},null,fin,[]));
    return s;
  }
  function quote(s,pid,target) {
    const p=policy(pid); if (!p) throw new Error('不明な施策です。');
    const d = p.town?null:district(s,target); if (!p.town && !d) throw new Error('地区が見つかりません。');
    const cost=(p.cost || d[p.basis]*p.mult)*Math.pow(1.004,s.year);
    return {total:cost,grant:cost*p.grant,own:cost*(1-p.grant),installment:cost/p.years,ownYear:cost*(1-p.grant)/p.years,annual:p.annual||0,years:p.years,staff:p.staff};
  }
  function usedStaff(s,plan) {
    return sum(s.projects.map(p=>p.staff))+sum(plan.projects.map(p=>policy(p.policy).staff));
  }
  function eligibility(s,pid,target,plan=defaultPlan(s),skipCapacity=false) {

    if (pid==='road_care' && (d.road<42||d.road>88)) return d.road<42?'損傷が進んでいます。重点更新が必要':'まだ予防修繕の時期ではありません';
    if (pid==='road_merge' && d.flags.roadMerge) return '道路は集約済みです';
    if (pid==='road_merge' && pop(d)>1500) return '人口1,500人以下の地区が対象';
    if ((pid==='road_merge'||pid==='facility_merge') && effective(s,d,'mobility')<58) return '先に交通を確保してください（交通58以上）';
    if (pid==='water_merge' && d.flags.waterMerge) return '給水設備は転換済みです';

    if (pid==='housing' && d.vacant-d.homes<8) return '改修対象の空き家が不足しています';
    if (pid==='relocation' && (d.id==='center'||d.id==='east'||d.id==='south')) return '周辺集落からの住み替えが対象';
    if (pid==='relocation' && district(s,'center').homes<5) return '中央駅前の入居可能な住宅が不足';

    if (!skipCapacity && usedStaff(s,plan)+p.staff>capacity(s,plan)) return '今年度の事業実施余力が不足しています';
    return '';

    return `<div class="modal-body"><div class="eyebrow">年度報告 ／ ${String(h.year).padStart(2,'0')}</div><h2>第${h.year}年度が終わりました。</h2><p class="intro">${df<0?'人口減少は続いています。自然減と社会増減を分けて、次の手を考えましょう。':df>0?'人口は前年より増加しました。将来の支出と生活サービスも確かめましょう。':'人口は前年と同数でした。収支と設備を見ながら、持続できるか確認しましょう。'}</p>
      <div class="report-metrics"><div class="report-metric"><p>町の人口</p><div class="num">${num(h.population)}</div><small>前年 ${signed(df)}人</small></div><div class="report-metric"><p>年度末の基金</p><div class="num">${money(h.funds)}</div><small>億円 ／ 前年 ${signedMoney(h.funds-prev.funds)}</small></div><div class="report-metric"><p>インフラ健全度</p><div class="num">${Math.round(h.safety)}</div><small>/100 ／ 前年 ${signed(Math.round(h.safety-prev.safety))}</small></div></div>
      <div class="population-flow"><div>出生<strong class="num positive">+${num(d.births)}</strong></div><div>死亡<strong class="num negative">−${num(d.deaths)}</strong></div><div>転入<strong class="num positive">+${num(d.incoming)}</strong></div><div>転出<strong class="num negative">−${num(d.outgoing)}</strong></div><div>町内転居<strong class="num">${num(d.internal)}</strong></div></div><p class="note">前年人口 ${num(prev.population)} ＋ 出生 − 死亡 ＋ 転入 − 転出 ＝ ${num(h.population)}人。町内転居は総人口を変えません。</p>
      <div class="report-logs">${logs.length?logs.map(l=>`<div class="report-log ${['complete','warning','event','danger'].includes(l.type)?l.type:''}">${esc(l.text)}</div>`).join(''):'<div class="report-log">新規事業・突発イベントはありませんでした。</div>'}</div>
      <div class="year-report-label">実際の年度収支（借入前） ${signedMoney(h.finance.actualBalance)}億円 ／ 通常借入 ${money(h.finance.borrow)}億円 ／ 緊急借入 ${money(h.finance.emergencyBorrow||0)}億円</div>
      <div class="modal-footer"><span class="note">現状維持の町より ${signed(h.population-reference[h.year].population)}人</span><button class="btn primary" data-action="${h.year===30&&state.year===30?'ending':'close-modal'}">${h.year===30&&state.year===30?'30年間の成績へ':h.year===state.year?'次の年度を計画する':'記録に戻る'} ${icon('arrow','sm')}</button></div></div>`;
  }
  function ending(){
    const sc=E.score(state,reference),last=state.history[state.year],prev=state.history[Math.max(0,state.year-1)],change=last.population-prev.population;
    openModal(`<div class="score-hero"><div class="eyebrow" style="color:#c8d6c2">30年後、町に残ったもの。</div><div class="score-number num">${sc.total}<small>/ 100</small></div><h2>${sc.label}</h2><p>人口だけでなく、財政・設備・暮らし・世代構成を評価しています。</p></div><div class="modal-body"><div class="report-metrics" style="margin-top:0"><div class="report-metric"><p>30年後の人口</p><div class="num">${num(E.townPop(state))}</div><small>現状維持比 ${signed(sc.diff)}人</small></div><div class="report-metric"><p>基金 / 借入</p><div class="num" style="font-size:19px">${money(state.funds)} / ${money(state.debt)}</div><small>億円 ／ 緊急借入 ${state.crisisYears}年度</small></div><div class="report-metric"><p>最終年度の人口増減</p><div class="num">${signed(change)}</div><small>人 ／ ${change>=0?'減少から転換':'減少が継続'}</small></div></div>
      <div class="score-bars">${bar('人口維持 30%',sc.people)}${bar('財政持続性 25%',sc.fiscal)}${bar('設備安全性 20%',sc.infra)}${bar('暮らし 15%',sc.services)}${bar('世代構成 10%',sc.generations)}</div><div class="attention">${sc.operating<0?'終盤の経常収支は赤字です。人口対策だけでなく、維持対象と継続経費の見直しが次の課題です。':sc.infra<55?'経常収支は持ちこたえていますが、設備の傷みが残っています。更新準備額と地区ごとの安全性を確認してください。':change<0?'暮らしと財政の基盤を確かめながら、転出の抑制と若い世帯の受入れを継続する余地があります。':'人口の増加と暮らしの維持を両立する兆しがあります。一年の好結果だけでなく、次の更新負担にも目を向けましょう。'}</div><p class="note" style="margin-top:12px">評価式と政策効果は試作用です。特定の現実の政策の優劣を証明するものではありません。</p><div class="modal-footer"><button class="btn" data-action="ending-records">30年の記録を見る</button><button class="btn primary" data-action="export">セーブを書き出す ${icon('download','sm')}</button></div></div>`);
  }
  function help(){
    openModal(`<div class="modal-body"><div class="eyebrow">遊び方・モデルについて</div><h2>町の暮らしを、つなぐために。</h2><div class="help-sections"><section><h3>毎年の操作</h3><p>地図で地区を選ぶ →「施策を選ぶ」で計画に追加 →「予算と事業」で基金・継続費・実施余力を確認 →「年度を実行」。30年間の記録と成績まで遊べます。</p></section><section><h3>お金と工期</h3><p>金額は億円表示。複数年事業は着手時の総額を工期で均等配分し、毎年払います。補助金は事業の一部だけに使い、町負担を減らします。完成は年度末。交通・子育て等の運用費は、完成の翌年度から毎年発生します。工事中の取消は未実装です。</p></section><section><h3>人口が変わる理由</h3><p>0〜14歳・15〜39歳・40〜64歳・65〜79歳・80歳以上の5区分を1年ずつ進め、出生・死亡・転入・転出を計算。転入候補は仕事・交通・子育て・移住支援で変わり、実際の転入は住める空き家の数が上限です。町内転居では総人口は変わりません。</p></section><section><h3>縮小にも準備が必要</h3><p>道路・施設の集約は、生活交通が58以上で実施可能。対象人口や集約済み状態でも制限されます。事業期間と初期費用を負担してから、維持費が下がります。水道の転換は代替給水を確保する前提のモデルです。</p></section><section><h3>老朽化・維持水準</h3><p>設備は毎年傷みます。道路の通常劣化は年1.65〜2.00、水道は1.90〜2.20、施設は1.55ポイント。維持費85%なら劣化1.6倍、115%なら0.55倍。健全度の低下は応急対応費と暮らしに影響します。健全度は人口加重平均なので、小集落の悪化を地図でも確認してください。</p></section><section><h3>財政の簡略モデル</h3><p>人口だけでなく働く世代と仕事の充実度で税収が変化。調整交付収入は人口の減少を一部緩和するゲーム独自の計算で、実際の地方交付税算定ではありません。「経常的な収支」も法定の財政指標とは異なります。施工・維持単価は年0.4%上昇、調整交付収入には年0.1%の逓減を仮定。借入金利1.5%、年初残高の4%を償還します。</p><p style="margin-top:8px">基金不足時は、途中で詰まらないよう「緊急つなぎ資金」が自動発生します。現実に無制限の借入ができる意味ではありません。最終評価に不利になります。</p></section><section><h3>比べ方と評価</h3><p>破線は、同じ町・同じイベントで新規施策なしの現状維持ケースです。人口30%・財政25%・設備20%・暮らし15%・若い世代の比率10%で採点。借入や更新負担を残して人口だけ増やすと評価が伸びにくくなります。</p></section><section><h3>試遊メモ</h3><p>右上の「試遊メモ」から、現在の年度・人口・基金・借入などを添えた感想テンプレートをTXTで書き出せます。試遊者はそのファイルに感想を書き足して返すだけで構いません。</p></section><section><h3>保存と動作環境</h3><p>自動保存は同じブラウザでの再開用です。ブラウザ変更・履歴削除・ファイルの移動で引き継げない場合があります。「書き出し」のJSONを保管すれば「読込」で復元できます。ログイン・外部通信・生成AIのAPIは使いません。PC優先の試作で、スマホ向けの幅調整も行っています。</p></section><section><h3>まだ再現していないこと</h3><p>道路・水道の実際の接続網、施設ごとの利用定員、合意形成の詳細、町外の住宅事情、災害避難計画、自治体会計や補助制度の実務。地図の線は模式図で、通行・給水を数理的に保証するネットワーク計算はしていません。</p></section></div><div class="modal-footer"><span class="note">モデル v${E.VERSION} ／ すべて架空の数値</span><button class="btn primary" data-action="close-modal">町に戻る</button></div></div>`);
  }
  function feedbackText(){
    const h=state.history[state.year], ref=reference[state.year];
    const popDiff=h&&ref?h.population-ref.population:0;
    const sc=state.year===30?E.score(state,reference):null;
    return [
      'まちを、つなぐ。｜試遊メモ',
      `ゲーム v${E.VERSION} / ${BUILD}`,
      `経過年度: ${state.year} / 30`,
      `突発イベント: ${state.events?'ON':'OFF'}`,
      `現在人口: ${num(E.townPop(state))}人（現状維持比 ${signed(popDiff)}人）`,
      `基金: ${money(state.funds)}億円 / 借入: ${money(state.debt)}億円`,
      sc?`30年評価: ${sc.total}/100（${sc.label}）`:'30年評価: 未到達',
      '',
      '【感想】',
      '1. 一番判断に迷った場面・施策は？',
      '',
      '2. 意味や操作が分かりにくかったところは？',
      '',
      '3. 強すぎる／弱すぎると感じた施策は？',
      '',
      '4. 人口・財政・インフラが動いた理由に納得できた？',
      '',
      '5. 別の方針でもう一度遊びたいと思った？　その理由は？',
      '',
      '6. バグ、表示崩れ、動かなかった操作は？',
      '',
      '7. その他、追加してほしい要素',
      '',
      '【動作環境】',
      navigator.userAgent
    ].join('\r\n');
  }
  function feedback(){
    openModal(`<div class="modal-body"><div class="eyebrow">試遊フィードバック</div><h2>遊んだ感触を、次の版につなぐ。</h2><p class="intro">細かな感想より、まずは「判断に迷えたか」「結果に納得できたか」「もう一度違うやり方を試したいか」が知りたいです。</p><div class="feedback-grid"><div class="feedback-card"><strong>判断</strong><span>残す・縮める・投資する、の選択で本当に迷ったか。</span></div><div class="feedback-card"><strong>納得感</strong><span>人口や財政が変わった理由を画面から理解できたか。</span></div><div class="feedback-card"><strong>バランス</strong><span>万能に見える施策や、選ぶ意味が薄い施策がなかったか。</span></div><div class="feedback-card"><strong>再挑戦</strong><span>次は別の運営方針でやってみたいと思えたか。</span></div></div><div class="baseline-note">現在の年度・人口・基金・借入・イベント設定と、感想の質問をまとめたTXTファイルを書き出せます。記入後、そのファイルを返してもらえばOKです。</div><div class="modal-footer"><span class="note">${BUILD}<br>現在 ${state.year} / 30年度</span><button class="btn" data-action="close-modal">戻る</button><button class="btn primary" data-action="feedback-export">試遊メモを書き出す ${icon('download','sm')}</button></div></div>`);
  }
  function confirmReset(){openModal(`<div class="modal-body"><div class="eyebrow">新しくはじめる</div><h2>現在の町を終了しますか？</h2><p class="intro">自動保存は新しい町で上書きされます。今の町を残す場合は、先にセーブデータを書き出してください。</p><div class="modal-footer"><button class="btn" data-action="export">先に書き出す</button><button class="btn danger" data-action="confirm-reset">最初の町に戻す</button></div></div>`);}
  function advance(confirmed=false){
    const f=E.finance(state,plan);
    if(!confirmed&&f.fundsAfter<0){openModal(`<div class="modal-body"><div class="eyebrow">基金不足の確認</div><h2>基金が${money(-f.fundsAfter)}億円、不足する見込みです。</h2><p class="intro">このまま実行すると、緊急つなぎ資金を自動で借り入れます。将来の返済負担と成績への影響があります。</p><div class="modal-footer"><button class="btn" data-action="review-budget">予算を見直す</button><button class="btn danger" data-action="force-advance">緊急借入を承知して実行</button></div></div>`);return;}
    try{const result=E.step(state,plan);state=result.state;plan=E.defaultPlan(state);save();render();openModal(reportHTML(result.report));}catch(err){toast('年度を進められません：'+err.message);console.error(err);}
  }
  function csv(){
    const rows=[['年度','人口_人','出生_人','死亡_人','転入_人','転出_人','町内転居_人','基金_億円','借入_億円','経常収支_億円','事業費町負担_億円','インフラ健全度','暮らし利便性','現状維持人口_人']];
    for(const h of state.history)rows.push([h.year,h.population,h.delta.births,h.delta.deaths,h.delta.incoming,h.delta.outgoing,h.delta.internal,h.funds.toFixed(4),h.debt.toFixed(4),h.finance.operating.toFixed(4),(h.finance.grossProjects-h.finance.projectGrants).toFixed(4),h.safety.toFixed(2),h.life.toFixed(2),reference[h.year].population]);
    download(`machi-record-year${state.year}.csv`,'\uFEFF'+rows.map(r=>r.join(',')).join('\r\n'),'text/csv;charset=utf-8');
    toast('年度記録をCSVで書き出しました。');
  }
  document.addEventListener('click',event=>{
    const el=event.target.closest('button,[data-select],[data-report]');if(!el||el.disabled)return;
    if(el.dataset.tab){tab=el.dataset.tab;render();window.scrollTo(0,0);return;}
    if(el.dataset.select){selected=el.dataset.select;save();render();return;}
    if(el.dataset.layer){layer=el.dataset.layer;render();return;}
    if(el.dataset.filter){filter=el.dataset.filter;render();return;}
    if(el.dataset.report){const h=state.history[Number(el.dataset.report)];if(h?.year)openModal(reportHTML(h));return;}
    if(el.dataset.policy){
      const pid=el.dataset.policy,target=el.dataset.target,at=plan.projects.findIndex(x=>x.policy===pid&&x.target===target);
      if(at>=0){plan.projects.splice(at,1);toast('今年度の計画から外しました。');}
      else{const why=E.eligibility(state,pid,target,plan);if(why){toast(why);return;}plan.projects.push({policy:pid,target});toast((E.district(state,target)?.name||'町全体')+'：'+E.policy(pid).name+'を計画に追加しました。');}
      save();render();return;
    }
    if(el.dataset.upkeep){plan.upkeep=Number(el.dataset.upkeep);save();render();return;}
    if(el.dataset.rate){plan.waterRate=E.clamp(plan.waterRate+Number(el.dataset.rate),Math.max(80,state.waterRate-5),Math.min(140,state.waterRate+5));save();render();return;}
    if(el.dataset.stop){
      const key=el.dataset.stop,i=plan.stops.indexOf(key);
      if(i>=0)plan.stops.splice(i,1);else{const test=E.clone(plan);test.stops.push(key);if(E.usedStaff(state,test)>E.capacity(state,test)){toast('共同管理を終了すると実施余力が不足します。新規計画を減らすか工事完了を待ってください。');return;}plan.stops.push(key);}
      save();render();return;
    }
    switch(el.dataset.action){
      case 'save':save(true);break;
      case 'export':download(`machi-save-year${state.year}.json`,JSON.stringify(payload(),null,2),'application/json');toast('セーブデータを書き出しました。');break;
      case 'import':document.getElementById('import-file').click();break;
      case 'help':help();break;
      case 'feedback':feedback();break;
      case 'feedback-export':download(`machi-feedback-year${state.year}.txt`,'\uFEFF'+feedbackText(),'text/plain;charset=utf-8');toast('試遊メモを書き出しました。記入して返してもらえばOKです。');break;
      case 'reset':confirmReset();break;
      case 'confirm-reset':closeModal();state=E.createState();plan=E.defaultPlan(state);selected='center';tab='overview';filter='すべて';reference=E.baseline();save();render();welcome();break;
      case 'start':{const checked=document.getElementById('welcome-events')?.checked;state.events=!!checked;reference=E.baseline({events:state.events,seed:state.seed});save();closeModal();render();break;}
      case 'close-modal':closeModal();break;
      case 'district-policies':tab='policies';filter='すべて';render();window.scrollTo(0,0);break;
      case 'advance':advance();break;
      case 'force-advance':closeModal();advance(true);break;
      case 'review-budget':closeModal();tab='budget';render();window.scrollTo(0,0);break;
      case 'ending':ending();break;
      case 'ending-records':closeModal();tab='history';render();window.scrollTo(0,0);break;
      case 'csv':csv();break;
    }
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.dataset.input==='district'){selected=el.value;save();render();}
    if(el.dataset.input==='borrow'){
      const n=Number(el.value);if(!Number.isFinite(n)){toast('借入額を数値で入力してください。');render();return;}
      plan.borrow=Math.round(E.clamp(n,0,Math.max(0,Math.min(5,65-state.debt)))*100)/100;save();render();
    }
  });
  document.addEventListener('keydown',event=>{
    const modal=document.querySelector('.modal');
    if(modal){
      if(event.key==='Escape'&&!modal.classList.contains('welcome')){closeModal();return;}
      if(event.key==='Tab'){const focusables=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex="0"]')];if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
    }else if(['Enter',' '].includes(event.key)&&(event.target.dataset.select||event.target.dataset.report)){event.preventDefault();event.target.click();}
  });
  document.getElementById('import-file').addEventListener('change',async event=>{
    const file=event.target.files[0];event.target.value='';if(!file)return;
    if(file.size>2*1024*1024){toast('ファイルが大きすぎます。2MB以下のセーブデータを選んでください。');return;}
    try{
      const raw=JSON.parse(await file.text());E.validateState(raw.state);
      // Parse and validate before showing a destructive-load confirmation.
      window.__pendingMachiImport=raw;
      openModal(`<div class="modal-body"><div class="eyebrow">セーブデータの読込</div><h2>${raw.state.year}年経過した町を読み込みます。</h2><p class="intro">現在の自動保存は読み込む町で置き換わります。現在の町を残す場合は先に書き出してください。</p><div class="modal-footer"><button class="btn" data-action="export">現在の町を書き出す</button><button class="btn primary" id="confirm-import">この町を読み込む</button></div></div>`);
      document.getElementById('confirm-import').addEventListener('click',()=>{try{loadPayload(window.__pendingMachiImport);delete window.__pendingMachiImport;closeModal();tab='overview';save();render();toast('セーブデータを読み込みました。');}catch(err){toast('読込できません：'+err.message);}});
    }catch(err){toast('読込できません：'+err.message);}
  });
  // Exposes read-only copies for reproducible model/UI testing and future development.
  window.MachiApp={getState:()=>E.clone(state),getPlan:()=>E.clone(plan),getReference:()=>E.clone(reference),exportData:()=>JSON.stringify(payload()),version:E.VERSION,build:BUILD,feedbackText};
  render();
  if(!loaded)welcome();
})();

</script>
</body>
</html>
